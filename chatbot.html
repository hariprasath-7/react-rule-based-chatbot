<!DOCTYPE html>
<html>
  <head>
    <title>ChatBot</title>

    <style>
      * {
        box-sizing: border-box;
      }

      body {
        font-family: Arial, sans-serif;
        margin: 0;
        background-color: #1a1a1a;
        color: #f5f5f5;
      }

      .js-container {
        height: 100vh;
      }

      .app-container {
        height: 100vh;
        max-width: 900px;
        margin-left: auto;
        margin-right: auto;
        display: flex;
        flex-direction: column;
        background-color: #1a1a1a;
      }

      .chat-header {
        height: 65px;
        display: flex;
        align-items: center;
        padding: 0 25px;
        border-bottom: 1px solid #333;
        background-color: #202020;
      }

      .chat-header-title {
        font-size: 20px;
        font-weight: bold;
        color: #ff8a3d;
      }

      .chat-messages-container {
        flex: 1;
        overflow-y: auto;
        padding: 30px 25px;
      }

      .chat-message-user {
        display: flex;
        justify-content: end;
        align-items: start;
        margin-bottom: 10px;
      }

      .chat-message-robot {
        display: flex;
        align-items: start;
        margin-bottom: 10px;
      }

      .chat-message-text {
        background-color: #2b2b2b;
        color: #f1f1f1;
        padding: 14px 18px;
        border-radius: 14px;
        margin-right: 10px;
        margin-left: 10px;
        margin-bottom: 20px;
        max-width: 600px;
        line-height: 1.5;
      }

      .chat-message-user .chat-message-text {
        background-color: #d96f2f;
        color: white;
      }

      .chat-message-profile {
        width: 42px;
        height: 42px;
        border-radius: 50%;
        object-fit: cover;
        margin-top: 3px;
      }

      .chat-input-container {
        display: flex;
        margin: 0 25px 25px 25px;
        padding: 8px;
        background-color: #252525;
        border: 1px solid #444;
        border-radius: 16px;
      }

      .chat-input {
        padding: 14px 15px;
        border: none;
        outline: none;
        background-color: transparent;
        color: white;
        font-size: 15px;
        flex-grow: 1;
      }

      .chat-input::placeholder {
        color: #888;
      }

      .send-button {
        background-color: #ff8a3d;
        color: #151515;
        padding: 12px 22px;
        margin: 2px;
        border: none;
        border-radius: 12px;
        font-size: 15px;
        font-weight: bold;
        cursor: pointer;
      }

      .send-button:hover {
        background-color: #ff9b55;
      }

      .send-button:active {
        transform: scale(0.97);
      }

      .chat-messages-container::-webkit-scrollbar {
        width: 7px;
      }

      .chat-messages-container::-webkit-scrollbar-track {
        background: #1a1a1a;
      }

      .chat-messages-container::-webkit-scrollbar-thumb {
        background: #444;
        border-radius: 10px;
      }

      @media (max-width: 700px) {
        .app-container {
          width: 100%;
        }

        .chat-messages-container {
          padding: 20px 15px;
        }

        .chat-input-container {
          margin-left: 15px;
          margin-right: 15px;
          margin-bottom: 15px;
        }

        .chat-message-text {
          max-width: 75%;
        }
      }
    </style>
  </head>

  <body>
    <div class="js-container"></div>

    <script src="react-basics.js"></script>

    <script src="https://unpkg.com/supersimpledev/react.js"></script>
    <script src="https://unpkg.com/supersimpledev/react-dom.js"></script>
    <script src="https://unpkg.com/supersimpledev/chatbot.js"></script>

    <script src="https://unpkg.com/supersimpledev/babel.js"></script>

    <script type="text/babel">

      function ChatInput({ chatMessages, setChatMessages }) {
        const [inputText, setInputText] = React.useState('');

        function saveInputText(event) {
          setInputText(event.target.value);
        }

        function sendMessage() {
          const newChatMessages = [
            ...chatMessages,
            {
              message: inputText,
              sender: 'user',
              id: crypto.randomUUID()
            }
          ];

          setChatMessages(newChatMessages);

          const responce = Chatbot.getResponse(inputText);

          setChatMessages([
            ...newChatMessages,
            {
              message: responce,
              sender: 'robot',
              id: crypto.randomUUID()
            }
          ]);

          setInputText('');
        }

        return (
          <div className="chat-input-container">

            <input
              placeholder="Send a message to chatbot"
              size="30"
              onChange={saveInputText}
              value={inputText}
              className="chat-input"
            />

            <button
              onClick={sendMessage}
              className="send-button"
            >
              Send
            </button>

          </div>
        );
      }


      function ChatMessage({ message, sender }) {

        return (
          <div className={
            sender === 'user'
              ? 'chat-message-user'
              : 'chat-message-robot'
          }>

            {sender === 'robot' && (
              <img
                src="robot.png"
                className="chat-message-profile"
              />
            )}

            <div className="chat-message-text">
              {message}
            </div>

            {sender === 'user' && (
              <img
                src="user.png"
                className="chat-message-profile"
              />
            )}

          </div>
        );
      }


      function ChatMessages({ chatMessages }) {

        const chatMessagesRef = React.useRef(null);

        React.useEffect(() => {
          const container = chatMessagesRef.current;

          if (container) {
            container.scrollTop = container.scrollHeight;
          }
        }, [chatMessages]);

        return (
          <div
            className="chat-messages-container"
            ref={chatMessagesRef}
          >
            {chatMessages.map((chatMessage) => {
              return (
                <ChatMessage
                  message={chatMessage.message}
                  sender={chatMessage.sender}
                  key={chatMessage.id}
                />
              );
            })}
          </div>
        );
      }


      function App() {
        const [chatMessages, setChatMessages] = React.useState([
  {
    message: '👋 Hey! Welcome to ChatBot! I’m happy to chat with you. Ask me anything and let’s get started! 😊',
    sender: 'robot',
    id: 'id1'
  }
]);

        return (
          <div className="app-container">

            <div className="chat-header">
              <div className="chat-header-title">
                ChatBot
              </div>
            </div>

            <ChatMessages
              chatMessages={chatMessages}
            />

            <ChatInput
              chatMessages={chatMessages}
              setChatMessages={setChatMessages}
            />

          </div>
        );
      }


      const container = document.querySelector('.js-container');

      ReactDOM.createRoot(container).render(<App />);

    </script>
  </body>
</html>
